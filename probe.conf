# RPi64 Alpine Diskless Probe - Configuration
# Location: root of the FAT32 SD card (/media/mmcblk0p1/probe.conf)
#
# See probe.conf.example for the full documentation of every option.

# ------------------------------------------------------------------------------
# 1. IDENTIFICATION
# ------------------------------------------------------------------------------
HOSTNAME=rpi-probe-01

CLIENT=
SITE=
LOCATION=

# ------------------------------------------------------------------------------
# 2. TIME AND KEYBOARD
# ------------------------------------------------------------------------------
TIMEZONE=Europe/Paris
KEYMAP=us

# ------------------------------------------------------------------------------
# 3. METRICS - PORT 9100
# ------------------------------------------------------------------------------
# Exporter open by default (no password).
# To protect it: see section 3 of probe.conf.example, which gives the command
# to generate the bcrypt hash.
#EXPORTER_PASSWORD_HASH=''
#EXPORTER_USER=probe

# ------------------------------------------------------------------------------
# 4. SSH ACCESS - port 34522, key authentication only
# ------------------------------------------------------------------------------
SSH_KEYS_URL="https://github.com/ts-sz.keys"
#ROOT_PASSWORD=

# ------------------------------------------------------------------------------
# 5. NETWORK - DHCP on eth0 by default
# ------------------------------------------------------------------------------
#STATIC_IP=10.0.0.150
#NET_MASK=255.255.255.0
#NET_GATEWAY=10.0.0.1
#DNS_SERVERS="1.1.1.1 8.8.8.8"
#NET_IFACE=eth0

#WIFI_SSID=
#WIFI_PASSWORD=
#WIFI_COUNTRY=FR

# ------------------------------------------------------------------------------
# 6. DS18B20 SENSORS - automatic detection
# ------------------------------------------------------------------------------
GPIO_PIN=4
