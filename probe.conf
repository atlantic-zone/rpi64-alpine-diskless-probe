# RPi64 Alpine Diskless Probe - Configuration
# Emplacement : racine de la carte SD FAT32 (/media/mmcblk0p1/probe.conf)
#
# Voir probe.conf.example pour la documentation complete de chaque option.

# ------------------------------------------------------------------------------
# 1. IDENTIFICATION
# ------------------------------------------------------------------------------
HOSTNAME=rpi-probe-01

CLIENT=
SITE=
LOCATION=

# ------------------------------------------------------------------------------
# 2. HEURE ET CLAVIER
# ------------------------------------------------------------------------------
TIMEZONE=Europe/Paris
KEYMAP=us

# ------------------------------------------------------------------------------
# 3. METRIQUES - PORT 9100
# ------------------------------------------------------------------------------
# Exporter ouvert par defaut (aucun mot de passe).
# Pour le proteger : voir la section 3 de probe.conf.example, qui donne la
# commande de generation de l'empreinte bcrypt.
#EXPORTER_PASSWORD_HASH=''
#EXPORTER_USER=probe

# ------------------------------------------------------------------------------
# 4. ACCES SSH - port 34522, par cle uniquement
# ------------------------------------------------------------------------------
SSH_KEYS_URL="https://github.com/ts-sz.keys"
#ROOT_PASSWORD=

# ------------------------------------------------------------------------------
# 5. RESEAU - DHCP sur eth0 par defaut
# ------------------------------------------------------------------------------
#STATIC_IP=10.0.0.150
#NET_MASK=255.255.255.0
#NET_GATEWAY=10.0.0.1
#DNS_SERVERS="1.1.1.1 8.8.8.8"

#WIFI_SSID=
#WIFI_PASSWORD=
#WIFI_COUNTRY=FR

# ------------------------------------------------------------------------------
# 6. CAPTEURS DS18B20 - detection automatique
# ------------------------------------------------------------------------------
GPIO_PIN=4
