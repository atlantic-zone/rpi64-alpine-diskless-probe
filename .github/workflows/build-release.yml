name: Build RPi64 Alpine Diskless Probe Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, archlinux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine CalVer Release Tag (vYYYY.MM.DD.RUN)
        id: tagger
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            DATE_STAMP=$(date -u +'%Y.%m.%d')
            TAG="v${DATE_STAMP}.${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
          echo "Target CalVer Release Tag: ${TAG}"

      - name: Run Automated Pre-Flight APKOVL & Kernel Validation
        run: |
          chmod +x scripts/validate-apkovl.sh
          ./scripts/validate-apkovl.sh

      - name: Set up QEMU binfmt for Docker arm64 container
        uses: docker/setup-qemu-action@v3

      - name: Build Release Bundle
        run: |
          set -e
          ALPINE_VER="3.20.2"
          ALPINE_BRANCH="v3.20"
          TARBALL_URL="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/aarch64/alpine-rpi-${ALPINE_VER}-aarch64.tar.gz"
          
          mkdir -p dist staging
          
          echo "Downloading official Alpine RPi aarch64 release..."
          curl -sSL "${TARBALL_URL}" | tar -xzf - -C staging/
          
          echo "Pre-downloading sshx binary (AArch64) into overlay/usr/local/bin..."
          mkdir -p overlay/usr/local/bin
          curl -sSL "https://sshx.s3.amazonaws.com/sshx-aarch64-unknown-linux-musl.tar.gz" | tar -xzf - -C overlay/usr/local/bin/ 2>/dev/null || \
          curl -sSL "https://github.com/ekcho/sshx/releases/latest/download/sshx-aarch64-unknown-linux-musl.tar.gz" | tar -xzf - -C overlay/usr/local/bin/ 2>/dev/null || true
          chmod +x overlay/usr/local/bin/sshx || true
          
          echo "Building apkovl overlay..."
          chmod +x build-apkovl.sh
          ./build-apkovl.sh
          cp build/rpi-probe.apkovl.tar.gz staging/localhost.apkovl.tar.gz
          
          echo "Injecting custom boot configurations..."
          cp boot/usercfg.txt staging/usercfg.txt
          cp boot/cmdline.txt staging/cmdline.txt
          cp probe.conf staging/probe.conf
          cp probe.conf.example staging/probe.conf.example
          
          echo "Pre-downloading APK packages into /cache..."
          mkdir -p staging/cache
          
          # Use alpine aarch64 docker container to fetch packages and dependencies
          docker run --rm -v $(pwd)/staging/cache:/cache -v $(pwd)/overlay/etc/apk/world:/world:ro \
            arm64v8/alpine:${ALPINE_VER} \
            sh -c "apk update && apk fetch --recursive -o /cache \$(cat /world)"
          
          echo "Packing final distribution archive..."
          tar -czf "dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz" -C staging .
          cp "dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz" "dist/rpi64-alpine-diskless-probe-latest.tar.gz"
          
          echo "Release bundle ready: dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz and dist/rpi64-alpine-diskless-probe-latest.tar.gz"
        env:
          STEPS_TAG: ${{ steps.tagger.outputs.TAG_NAME }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi64-alpine-diskless-probe
          path: dist/*.tar.gz

      - name: Create GitHub Release (CalVer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.TAG_NAME }}
          name: ${{ steps.tagger.outputs.TAG_NAME }} - CalVer Release
          body: |
            ## 🌡️ RPi64 Alpine Diskless Probe - Release `${{ steps.tagger.outputs.TAG_NAME }}`
            
            Standalone **Alpine Linux Diskless (100% RAM)** distribution for Raspberry Pi 3, 4, and 5 (`aarch64` / `rpi64`).
            
            ### Included in this build:
            - **Pre-baked `sshx` Binary:** Pre-installed in `/usr/local/bin/sshx` for manual/emergency remote web terminal assistance (not launched automatically).
            - **CalVer Standard Tagging:** Versioned by date (`vYYYY.MM.DD.RUN`).
            - **Real QEMU Integration Test:** Live boot smoke-tested in CI via QEMU AArch64.
            - **Automated QA Validation:** Passed syntax, OpenRC dependency, and kernel module checks.
            - **Dual-Mode Metrics Engine:** Busybox HTTPD Prometheus PULL Exporter (port `9100`) + VictoriaMetrics / InfluxDB PUSH Exporter.
            - **Pre-cached APKs:** All packages pre-downloaded in `/cache` for offline/diskless boot.
          make_latest: "true"
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Latest Release to Local FOG Server (/var/www/fog/os/rpi-probe/)
        run: |
          echo "Deploying release to local FOG server via internal LAN..."
          mkdir -p /tmp/fog-deploy
          tar -xzf dist/rpi64-alpine-diskless-probe-latest.tar.gz -C /tmp/fog-deploy
          ssh -o StrictHostKeyChecking=no root@10.255.255.252 "mkdir -p /var/www/fog/os/rpi-probe/"
          rsync -avz --delete /tmp/fog-deploy/ root@10.255.255.252:/var/www/fog/os/rpi-probe/
          rm -rf /tmp/fog-deploy
          echo "✓ Successfully updated /var/www/fog/os/rpi-probe/ on FOG Server!"

      - name: Cleanup Old Releases (Keep Last 5 Releases)
        run: |
          python3 -c "
          import urllib.request, json, os

          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          keep_count = 5

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases',
              headers={'Authorization': f'token {token}', 'User-Agent': 'HermesAgent'}
          )
          
          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode('utf-8'))
              
              if len(releases) > keep_count:
                  old_releases = releases[keep_count:]
                  print(f'Found {len(releases)} releases. Cleaning up {len(old_releases)} older releases (keeping newest {keep_count})...')
                  for r in old_releases:
                      rel_id = r['id']
                      tag = r.get('tag_name', 'unknown')
                      del_req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/releases/{rel_id}',
                          headers={'Authorization': f'token {token}', 'User-Agent': 'HermesAgent'},
                          method='DELETE'
                      )
                      try:
                          urllib.request.urlopen(del_req)
                          print(f'  - Deleted release {tag} (ID: {rel_id})')
                      except Exception as e:
                          print(f'  - Failed to delete release {tag}: {e}')
              else:
                  print(f'Releases count ({len(releases)}) is within the limit of {keep_count}. No cleanup needed.')
          except Exception as e:
              print(f'Cleanup check error: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Release Notification
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STEPS_TAG: ${{ steps.tagger.outputs.TAG_NAME }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚀 **New Release Published (${STEPS_TAG}):** [rpi64-alpine-diskless-probe](https://github.com/atlantic-zone/rpi64-alpine-diskless-probe/releases/tag/${STEPS_TAG})\\\\nStandalone Alpine Linux Diskless (100% RAM) bundle for RPi 3, 4 & 5 is built and ready.\"}" \
            "$DISCORD_WEBHOOK"
