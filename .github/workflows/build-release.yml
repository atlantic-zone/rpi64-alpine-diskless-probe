name: Build RPi64 Alpine Diskless Probe Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted runner: the self-hosted Arch runner is not guaranteed to be
    # online, and a job waiting for it queues silently with no error or alert.
    # QEMU binfmt is installed by docker/setup-qemu-action, so the arm64 build
    # container runs fine on an x86 host.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine CalVer Release Tag (vYYYY.MM.DD.RUN)
        id: tagger
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            DATE_STAMP=$(date -u +'%Y.%m.%d')
            TAG="v${DATE_STAMP}.${GITHUB_RUN_NUMBER}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_OUTPUT
          echo "Target CalVer Release Tag: ${TAG}"

      - name: Run Automated Pre-Flight APKOVL & Kernel Validation
        run: |
          chmod +x scripts/validate-apkovl.sh
          ./scripts/validate-apkovl.sh

      - name: Set up QEMU binfmt for Docker arm64 container
        uses: docker/setup-qemu-action@v3

      - name: Build Release Bundle
        run: |
          set -e
          ALPINE_VER="3.20.2"
          ALPINE_BRANCH="v3.20"
          TARBALL_URL="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/aarch64/alpine-rpi-${ALPINE_VER}-aarch64.tar.gz"
          
          mkdir -p dist staging
          
          echo "Downloading official Alpine RPi aarch64 release..."
          curl -sSL "${TARBALL_URL}" | tar -xzf - -C staging/
          
          echo "Preparing the apkovl build..."
          chmod +x build-apkovl.sh
          # build-apkovl.sh runs after the boot repository step, because the
          # overlay has to carry the public key that signs the repository index.
          
          echo "Injecting custom boot configurations..."
          cp boot/usercfg.txt staging/usercfg.txt
          cp boot/cmdline.txt staging/cmdline.txt
          cp probe.conf staging/probe.conf
          cp probe.conf.example staging/probe.conf.example
          
          echo "Building the offline boot repository..."
          # The initramfs installs the world file from the directories flagged by
          # a .boot_repository marker, and reads each one through its APKINDEX.
          # Packages therefore have to live in an indexed boot repository to be
          # installed at boot: probe-apks/ is that repository.
          #
          # apk requires a signed index, so the build generates a key pair, signs
          # the index with the private half and ships the public half inside the
          # apkovl at /etc/apk/keys/. The initramfs merges the Alpine keys into
          # the same directory, so both sets are trusted on the running probe.
          #
          # --rewrite-arch records every package as aarch64, which is how the
          # official alpine-rpi index handles noarch subpackages such as
          # prometheus-node-exporter-openrc: apk resolves them under <repo>/aarch64/.
          mkdir -p staging/probe-apks/aarch64 overlay/etc/apk/keys keys

          docker run --rm \
            -v $(pwd)/staging/probe-apks/aarch64:/repo \
            -v $(pwd)/overlay/etc/apk/world:/world:ro \
            -v $(pwd)/keys:/keys \
            arm64v8/alpine:${ALPINE_VER} \
            sh -c '
              set -e
              apk add --quiet alpine-sdk
              abuild-keygen -a -n -q
              KEY=$(ls /root/.abuild/*.rsa | head -1)
              apk update --quiet
              apk fetch --quiet --recursive -o /repo $(cat /world)
              cd /repo
              apk index --quiet --rewrite-arch aarch64 -o index.tar.gz *.apk
              abuild-sign -k "$KEY" index.tar.gz
              mv index.tar.gz APKINDEX.tar.gz
              cp "${KEY}.pub" /keys/
            '

          cp keys/*.rsa.pub overlay/etc/apk/keys/
          touch staging/probe-apks/.boot_repository

          echo "Boot repository: $(ls staging/probe-apks/aarch64/*.apk | wc -l) packages"
          echo "Signing key shipped in the apkovl: $(ls overlay/etc/apk/keys/)"

          # The apkovl carries the public key, so it is rebuilt now that the key exists.
          ./build-apkovl.sh
          cp build/rpi-probe.apkovl.tar.gz staging/localhost.apkovl.tar.gz

          # Every package named in the world file must be resolvable from the
          # boot repository, otherwise the probe boots without those binaries.
          docker run --rm \
            -v $(pwd)/staging/probe-apks:/repo:ro \
            -v $(pwd)/overlay/etc/apk/world:/world:ro \
            -v $(pwd)/overlay/etc/apk/keys:/pub:ro \
            arm64v8/alpine:${ALPINE_VER} \
            sh -c '
              set -e
              mkdir -p /target/etc/apk/keys
              apk add --root /target --initdb --quiet
              cp -a /etc/apk/keys/. /target/etc/apk/keys/
              cp /pub/*.pub /target/etc/apk/keys/
              apk add --root /target --repository /repo --no-network \
                  --initramfs-diskless-boot --clean-protected $(cat /world)
              for f in usr/bin/curl usr/bin/node_exporter usr/sbin/sshd \
                       etc/init.d/node-exporter etc/init.d/sshd etc/conf.d/node-exporter; do
                  if [ -e "/target/$f" ]; then
                      echo "  present: /$f"
                  else
                      echo "ERROR: /$f absent after an offline boot install" >&2
                      exit 1
                  fi
              done
              echo "Offline boot install verified."
            '
          
          echo "Packing final distribution archive..."
          STEPS_TAG="${{ steps.tagger.outputs.TAG_NAME }}"
          tar -czf "dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz" -C staging .
          cp "dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz" "dist/rpi64-alpine-diskless-probe-latest.tar.gz"
          
          echo "Release bundle ready: dist/rpi64-alpine-diskless-probe-${STEPS_TAG}.tar.gz and dist/rpi64-alpine-diskless-probe-latest.tar.gz"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi64-alpine-diskless-probe
          path: dist/*.tar.gz

      - name: Create GitHub Release (CalVer)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.TAG_NAME }}
          name: ${{ steps.tagger.outputs.TAG_NAME }} - CalVer Release
          body: |
            ## 🌡️ RPi64 Alpine Diskless Probe - Release `${{ steps.tagger.outputs.TAG_NAME }}`
            
            Standalone **Alpine Linux Diskless (100% RAM)** distribution for Raspberry Pi 3, 4, and 5 (`aarch64` / `rpi64`).
            
            ### Included in this build:
            - **Native Prometheus metrics:** `node_exporter` on port `9100`, DS18B20 sensors exposed automatically through hwmon.
            - **Optional authentication:** basic auth enabled by a bcrypt hash in `probe.conf` (no plaintext password on the SD card).
            - **Hardened SSH:** port `34522`, key authentication only.
            - **Zero mandatory configuration:** the probe boots with no `probe.conf` at all (DHCP, US keymap, Paris time).
            - **CalVer Standard Tagging:** Versioned by date (`vYYYY.MM.DD.RUN`).
            - **Real QEMU Integration Test:** Live boot smoke-tested in CI via QEMU AArch64.
            - **Automated QA Validation:** Passed syntax, OpenRC dependency, and kernel module checks.
            - **Offline boot repository:** every package in the world file ships in a signed, indexed `probe-apks/` repository, so `curl`, `tmux`, `node_exporter` and the OpenRC service scripts are installed on the running probe at first boot.
            - **Branded console:** Atlantic Zone MOTD with the probe's operating facts and its useful commands.
          make_latest: "true"
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Old Releases (Keep Last 5 Releases)
        run: |
          python3 -c "
          import urllib.request, json, os

          token = os.environ.get('GITHUB_TOKEN')
          repo = os.environ.get('GITHUB_REPOSITORY')
          keep_count = 5

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases',
              headers={'Authorization': f'token {token}', 'User-Agent': 'HermesAgent'}
          )
          
          try:
              with urllib.request.urlopen(req) as resp:
                  releases = json.loads(resp.read().decode('utf-8'))
              
              if len(releases) > keep_count:
                  old_releases = releases[keep_count:]
                  print(f'Found {len(releases)} releases. Cleaning up {len(old_releases)} older releases (keeping newest {keep_count})...')
                  for r in old_releases:
                      rel_id = r['id']
                      tag = r.get('tag_name', 'unknown')
                      del_req = urllib.request.Request(
                          f'https://api.github.com/repos/{repo}/releases/{rel_id}',
                          headers={'Authorization': f'token {token}', 'User-Agent': 'HermesAgent'},
                          method='DELETE'
                      )
                      try:
                          urllib.request.urlopen(del_req)
                          print(f'  - Deleted release {tag} (ID: {rel_id})')
                      except Exception as e:
                          print(f'  - Failed to delete release {tag}: {e}')
              else:
                  print(f'Releases count ({len(releases)}) is within the limit of {keep_count}. No cleanup needed.')
          except Exception as e:
              print(f'Cleanup check error: {e}')
          "
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Release Notification
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STEPS_TAG: ${{ steps.tagger.outputs.TAG_NAME }}
        run: |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"🚀 **New Release Published (${STEPS_TAG}):** [rpi64-alpine-diskless-probe](https://github.com/atlantic-zone/rpi64-alpine-diskless-probe/releases/tag/${STEPS_TAG})\\\\nStandalone Alpine Linux Diskless (100% RAM) bundle for RPi 3, 4 & 5 is built and ready.\"}" \
            "$DISCORD_WEBHOOK"
